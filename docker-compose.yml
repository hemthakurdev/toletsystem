version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salemitra_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - salemitra
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: salemitra_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - salemitra
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: salemitra_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: salemitra
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: salemitra
      MYSQL_PASSWORD: salemitra
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    ports:
      - "3306:3306"
    networks:
      - salemitra

  redis:
    image: redis:alpine
    container_name: salemitra_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - salemitra

  mailhog:
    image: mailhog/mailhog
    container_name: salemitra_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - salemitra

volumes:
  db_data:
    driver: local

networks:
  salemitra:
    driver: bridge
